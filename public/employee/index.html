<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Afrad Employee</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0E2A47">
<link rel="manifest" href="/employee/manifest.webmanifest"><link rel="apple-touch-icon" href="/brand/png/afrad-icon-180.png"><link rel="icon" href="/favicon.ico">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#F3F6F8;color:#0E2A47}
header{background:#0E2A47;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:18px}button,input{font:inherit}main{max-width:480px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #dbe3ea;border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;margin:10px 0 4px;color:#475569}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#0E2A47;color:#fff;font-weight:700;margin-top:12px}
.btn.go{background:#0f9d6b}.btn.out{background:#c2410c}.btn.alt{background:#fff;color:#0E2A47;border:1px solid #0E2A47}
.sm{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;width:auto;margin:0}
.msg{padding:10px;border-radius:10px;margin:10px 0;font-size:14px}.err{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
.state{font-size:22px;font-weight:800}.muted{color:#64748b;font-size:13px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;text-align:start;border-bottom:1px solid #eef2f6}
</style></head><body>
<header><b>Afrad</b><span><button class="sm" id="lang"></button> <button class="sm" id="out" hidden></button></span></header>
<main id="app"></main><script src="/employee/app.js"></script></body></html>
